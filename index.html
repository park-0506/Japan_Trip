<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>오사카 여행 메이트</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- CSS 스타일 --- */
        * { box-sizing: border-box; outline: none; }
        body { margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; overflow: hidden; height: 100vh; background: #fff; }

        /* 1. 지도 영역 */
        #map-container { width: 100%; height: 65%; transition: height 0.4s ease; position: relative; z-index: 1; }
        iframe { width: 100%; height: 100%; border: none; }
        .my-location-btn {
            position: absolute; bottom: 20px; right: 20px;
            background: white; border-radius: 50%; width: 50px; height: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: #333; cursor: pointer; z-index: 10;
        }

        /* 2. 시간표 영역 */
        #schedule-container {
            width: 100%; height: 35%; background: white;
            border-radius: 25px 25px 0 0; box-shadow: 0 -5px 20px rgba(0,0,0,0.15);
            position: absolute; bottom: 0; transition: height 0.4s ease;
            z-index: 20; display: flex; flex-direction: column;
        }
        .schedule-header { padding: 15px 25px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .schedule-title { font-size: 18px; font-weight: bold; color: #333; }
        .expand-btn { font-size: 13px; color: #007bff; background: #f0f7ff; padding: 5px 12px; border-radius: 15px; border: none; cursor: pointer; }
        
        .schedule-list { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 80px; }
        
        /* 날짜 섹션 */
        .date-section { margin-bottom: 30px; }
        .date-header { 
            background: #f8f9fa; padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; 
            display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee;
        }
        .date-picker { border: none; background: transparent; font-size: 16px; font-weight: bold; color: #333; font-family: inherit; cursor: pointer; }
        .delete-date-btn { color: #ff4757; font-size: 11px; cursor: pointer; background: white; padding: 4px 8px; border-radius: 6px; border: 1px solid #ff4757; }

        /* ▼▼▼ 수정된 부분: 2줄 배치 (상단: 시간+버튼 / 하단: 내용) ▼▼▼ */
        .time-slot { 
            display: flex; 
            flex-direction: column; /* 세로 배치 */
            margin-bottom: 15px; 
            background: white;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 15px;
        }
        
        /* 1줄: 시간 범위 + 버튼들 */
        .time-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px;
        }
        .time-range-box {
            display: flex; align-items: center; gap: 2px;
        }
        .time-picker {
            border: 1px solid #ddd; border-radius: 6px; padding: 0; 
            font-size: 13px; color: #333; background: #fff; font-family: inherit;
            width: 90px; height: 30px; text-align: center; font-weight: 600; letter-spacing: -0.5px;
        }
        .tilde { font-weight: bold; color: #ccc; margin: 0 4px; font-size: 12px;}

        /* 버튼 그룹 (위/아래/삭제) */
        .btn-group { display: flex; align-items: center; gap: 5px; }
        .control-btn { 
            color: #aaa; cursor: pointer; padding: 5px; font-size: 14px; 
            width: 24px; height: 24px; text-align: center;
            background: #f5f5f5; border-radius: 4px;
        }
        .control-btn:hover { background: #eee; color: #333; }
        .delete-btn { color: #ffabaf; background: #fff0f0; }
        .delete-btn:hover { color: #ff4757; background: #ffebeb; }

        /* 2줄: 일정 텍스트 입력 (꽉 차게) */
        .event-input { 
            background: #f9f9f9; padding: 10px 12px; border-radius: 8px; width: 100%; height: 40px;
            border: 1px solid #eee; font-size: 15px; /* 글자 크기 확보 */
        }
        /* ▲▲▲ 수정 끝 ▲▲▲ */

        .add-event-btn { width: 100%; padding: 10px; border: 2px dashed #eee; border-radius: 10px; color: #aaa; background: white; margin-top: 5px; cursor: pointer; font-size: 14px; }
        .add-date-float-btn { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 30px; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); cursor: pointer; z-index: 30; }

        .checklist-fab { position: fixed; top: 80px; right: 20px; width: 45px; height: 45px; background-color: #ff4757; border-radius: 50%; box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4); display: flex; align-items: center; justify-content: center; color: white; font-size: 22px; z-index: 100; cursor: pointer; border: none; }

        #checklist-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; }
        .modal-content { background: white; width: 85%; max-width: 400px; height: 70%; border-radius: 20px; padding: 25px; position: relative; display: flex; flex-direction: column; }
        .check-input-area { display: flex; gap: 10px; margin-bottom: 20px; }
        .check-input-area input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .check-input-area button { padding: 10px 15px; background: #ff4757; color: white; border: none; border-radius: 8px; }
        .check-list-box { flex: 1; overflow-y: auto; }
        .check-item { margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
        .check-left { display: flex; align-items: center; flex: 1; }
        .check-item input[type="checkbox"] { transform: scale(1.3); margin-right: 12px; }
        .check-del { color: #ddd; padding: 5px; }
    </style>
</head>
<body>

    <button class="checklist-fab" onclick="toggleModal()"><i class="fas fa-check"></i></button>

    <div id="map-container">
        <iframe src="https://www.google.com/maps/d/u/0/embed?mid=1AItyBmYPOxmXzIvjD4X4MmCJsbpDEww&usp=sharing" allow="geolocation"></iframe>
        <div class="my-location-btn" onclick="getLocation()"><i class="fas fa-crosshairs"></i></div>
    </div>

    <div id="schedule-container">
        <div class="schedule-header" onclick="toggleSchedule()">
            <span class="schedule-title">📅 여행 일정</span>
            <button class="expand-btn" id="expand-text">자세히 보기</button>
        </div>
        <div class="schedule-list" id="schedule-list-area"></div>
        <div class="add-date-float-btn" onclick="addDate()">+ 날짜 추가</div>
    </div>

    <div id="checklist-modal">
        <div class="modal-content">
            <span style="position:absolute; top:15px; right:20px; font-size:24px; color:#aaa; cursor:pointer;" onclick="toggleModal()">×</span>
            <h2>✅ 준비물</h2>
            <div class="check-input-area">
                <input type="text" id="new-check-input" placeholder="준비물 입력...">
                <button onclick="addCheckItem()">추가</button>
            </div>
            <div class="check-list-box" id="check-list-area"></div>
        </div>
    </div>

    <script>
        // ▼▼▼ 지민님의 오사카 전체 일정 (하드코딩) ▼▼▼
        const defaultSchedule = [
            {
                id: 1, date: "2026-01-27",
                events: [
                    { startTime: "14:25", endTime: "15:55", text: "✈️ 대구공항 → 간사이공항 (KIX)" },
                    { startTime: "16:20", endTime: "17:40", text: "🏨 숙소(BON 호스텔) 이동 (¥970)" },
                    { startTime: "18:15", endTime: "18:30", text: "🚃 도톤보리로 이동 (¥190)" },
                    { startTime: "18:30", endTime: "19:30", text: "🍜 저녁 식사 (도톤보리)" },
                    { startTime: "19:30", endTime: "22:30", text: "🚶 글리코상 & 신사이바시 구경" },
                    { startTime: "22:30", endTime: "23:00", text: "🏠 숙소 복귀 (¥190)" }
                ]
            },
            {
                id: 2, date: "2026-01-28",
                events: [
                    { startTime: "09:30", endTime: "10:00", text: "🏯 오사카성 이동 (¥240)" },
                    { startTime: "10:00", endTime: "12:30", text: "📸 오사카성 관람 (¥1400)" },
                    { startTime: "12:30", endTime: "14:00", text: "🍱 점심 (조-테라스 오사카)" },
                    { startTime: "14:00", endTime: "14:30", text: "🚃 덴덴타운 이동 (¥240)" },
                    { startTime: "14:30", endTime: "17:30", text: "🤖 덴덴타운 굿즈샵 투어" },
                    { startTime: "17:30", endTime: "18:00", text: "🚶 신세카이로 이동" },
                    { startTime: "18:00", endTime: "20:30", text: "🍢 신세카이 저녁 & 구경" },
                    { startTime: "20:30", endTime: "21:00", text: "🏠 숙소 복귀 (도보)" }
                ]
            },
            {
                id: 3, date: "2026-01-29",
                events: [
                    { startTime: "08:30", endTime: "09:45", text: "🚆 교토 가와라마치 이동 (¥650)" },
                    { startTime: "10:00", endTime: "12:00", text: "🍡 니시키 시장 & 점심" },
                    { startTime: "12:00", endTime: "14:00", text: "🛍️ 테라마치 & 신쿄고쿠 상점가" },
                    { startTime: "14:00", endTime: "17:00", text: "⛩️ 가모강, 기온, 야사카 신사" },
                    { startTime: "17:00", endTime: "18:30", text: "🚆 우메다로 복귀 (¥410)" },
                    { startTime: "18:30", endTime: "21:30", text: "🌃 우메다 야경 & 저녁" },
                    { startTime: "21:30", endTime: "22:00", text: "🏠 숙소 복귀 (¥240)" }
                ]
            },
            {
                id: 4, date: "2026-01-30",
                events: [
                    { startTime: "09:30", endTime: "10:00", text: "🛅 체크아웃 & 코인라커 (¥890)" },
                    { startTime: "10:00", endTime: "14:00", text: "🛍️ 덴덴타운 쇼핑 & 점심" },
                    { startTime: "14:00", endTime: "16:00", text: "🏢 난바 파크스/백화점 쇼핑" },
                    { startTime: "16:30", endTime: "17:00", text: "🎒 짐 찾기 -> 난카이 난바역" },
                    { startTime: "17:00", endTime: "18:00", text: "🚆 공항 이동 (¥970)" },
                    { startTime: "18:00", endTime: "19:00", text: "✈️ 출국 수속" }
                ]
            }
        ];

        const defaultChecklist = [
            { text: "여권 챙기기 (유효기간 확인)", checked: false },
            { text: "110V 돼지코 어댑터", checked: false },
            { text: "Visit Japan Web 캡처", checked: false },
            { text: "숙소(BON Hostel) 바우처", checked: false },
            { text: "동전 지갑", checked: false },
            { text: "보조 배터리", checked: false }
        ];

        // ▼▼▼ Key를 '_final'로 바꿔서 강제로 새 일정을 로딩합니다! ▼▼▼
        let scheduleData = JSON.parse(localStorage.getItem('osaka_schedule_final')) || defaultSchedule;
        let checkData = JSON.parse(localStorage.getItem('osaka_checklist_final')) || defaultChecklist;

        function saveData() {
            localStorage.setItem('osaka_schedule_final', JSON.stringify(scheduleData));
            localStorage.setItem('osaka_checklist_final', JSON.stringify(checkData));
            renderAll();
        }

        function renderAll() {
            const sArea = document.getElementById('schedule-list-area'); sArea.innerHTML = "";
            
            scheduleData.forEach((day, dIndex) => {
                let eventsHtml = "";
                day.events.forEach((evt, eIndex) => {
                    const sTime = evt.startTime || evt.time || "09:00";
                    const eTime = evt.endTime || "10:00";
                    
                    // 2줄 배치 적용: 1줄(시간+버튼) / 2줄(내용)
                    eventsHtml += `
                        <div class="time-slot">
                            <div class="time-row">
                                <div class="time-range-box">
                                    <input type="time" class="time-picker" step="300" value="${sTime}" onchange="updateEvent(${dIndex}, ${eIndex}, 'startTime', this.value)">
                                    <span class="tilde">~</span>
                                    <input type="time" class="time-picker" step="300" value="${eTime}" onchange="updateEvent(${dIndex}, ${eIndex}, 'endTime', this.value)">
                                </div>
                                <div class="btn-group">
                                    <i class="fas fa-chevron-up control-btn" onclick="moveEvent(${dIndex}, ${eIndex}, -1)"></i>
                                    <i class="fas fa-chevron-down control-btn" onclick="moveEvent(${dIndex}, ${eIndex}, 1)"></i>
                                    <i class="fas fa-times control-btn delete-btn" onclick="deleteEvent(${dIndex}, ${eIndex})"></i>
                                </div>
                            </div>
                            <input class="event-input" value="${evt.text}" placeholder="일정 입력" onchange="updateEvent(${dIndex}, ${eIndex}, 'text', this.value)">
                        </div>`;
                });

                sArea.innerHTML += `
                    <div class="date-section">
                        <div class="date-header">
                            <input type="date" class="date-picker" value="${day.date}" onchange="updateDateTitle(${dIndex}, this.value)">
                            <span class="delete-date-btn" onclick="deleteDate(${dIndex})">날짜 삭제</span>
                        </div>
                        ${eventsHtml}
                        <button class="add-event-btn" onclick="addEvent(${dIndex})">+ 일정 추가</button>
                    </div>`;
            });

            const cArea = document.getElementById('check-list-area'); cArea.innerHTML = "";
            checkData.forEach((item, index) => {
                cArea.innerHTML += `<div class="check-item"><div class="check-left"><input type="checkbox" ${item.checked ? "checked" : ""} onchange="toggleCheck(${index})"><label style="${item.checked ? 'text-decoration:line-through; color:#ccc' : ''}">${item.text}</label></div><i class="fas fa-trash check-del" onclick="deleteCheck(${index})"></i></div>`;
            });
        }

        function addDate() { const today = new Date().toISOString().substring(0, 10); scheduleData.push({ id: Date.now(), date: today, events: [] }); saveData(); }
        function deleteDate(index) { if(confirm("이 날짜를 삭제할까요?")) { scheduleData.splice(index, 1); saveData(); }}
        function updateDateTitle(index, val) { scheduleData[index].date = val; saveData(); }
        function addEvent(dIndex) { scheduleData[dIndex].events.push({ startTime: "12:00", endTime: "13:00", text: "" }); saveData(); }
        function deleteEvent(dIndex, eIndex) { scheduleData[dIndex].events.splice(eIndex, 1); saveData(); }
        function updateEvent(dIndex, eIndex, key, val) { scheduleData[dIndex].events[eIndex][key] = val; saveData(); }
        
        function moveEvent(dIndex, eIndex, direction) {
            const events = scheduleData[dIndex].events;
            if (direction === -1 && eIndex > 0) { [events[eIndex], events[eIndex - 1]] = [events[eIndex - 1], events[eIndex]]; saveData(); }
            else if (direction === 1 && eIndex < events.length - 1) { [events[eIndex], events[eIndex + 1]] = [events[eIndex + 1], events[eIndex]]; saveData(); }
        }

        function addCheckItem() { const input = document.getElementById('new-check-input'); if (input.value.trim() === "") return; checkData.push({ text: input.value, checked: false }); input.value = ""; saveData(); }
        function deleteCheck(index) { checkData.splice(index, 1); saveData(); }
        function toggleCheck(index) { checkData[index].checked = !checkData[index].checked; saveData(); }
        
        let isExpanded = false;
        function toggleSchedule() {
            const mapBox = document.getElementById('map-container'); const scheduleBox = document.getElementById('schedule-container'); const btnText = document.getElementById('expand-text');
            if (!isExpanded) { mapBox.style.height = "35%"; scheduleBox.style.height = "65%"; btnText.innerText = "접기"; } else { mapBox.style.height = "65%"; scheduleBox.style.height = "35%"; btnText.innerText = "자세히 보기"; }
            isExpanded = !isExpanded;
        }
        function toggleModal() { const modal = document.getElementById('checklist-modal'); modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex'; }
        function getLocation() { if (navigator.geolocation) { alert("현재 위치를 확인합니다."); navigator.geolocation.getCurrentPosition(pos => { window.open(`https://www.google.com/maps/search/?api=1&query=${pos.coords.latitude},${pos.coords.longitude}`); }); }}
        
        renderAll();
    </script>
</body>
</html>
